name: Dependency Review

# Vulnerability/license check on the dependency diff a PR introduces. The
# equivalent check for what's already merged only runs nightly, so a PR that
# adds a vulnerable dependency was previously caught up to a day after it
# landed on main. This gates it at the PR itself.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: critical
