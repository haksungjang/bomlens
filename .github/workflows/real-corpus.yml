name: Real-repository corpus

# Real public repositories pinned to commits (tests/corpus/real-corpus.tsv),
# scanned with the scanner image built from this commit. Reports, per
# repository, components found, purl and license coverage, exit code and whether
# the scan left the checkout changed, and fails on an empty result, a failed or
# timed-out scan, or a changed source tree. A repository that cannot be fetched
# is "undetermined", not a failure. Scheduled and manual only: never a required
# check and not part of the nightly failure alarm (observation stage), and it
# does not run on pull requests.
on:
  schedule:
    - cron: "47 19 * * *"
  workflow_dispatch:
    inputs:
      ecosystems:
        description: "Limit to these ecosystems (space separated, e.g. 'go rust'); empty runs all"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  real-corpus:
    name: Real-repository corpus
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build scanner image from this commit
        run: docker build -t sbom-scanner:test ./docker

      - name: Scan the corpus
        env:
          SBOM_SCANNER_IMAGE: sbom-scanner:test
          ECOSYSTEMS: ${{ inputs.ecosystems }}
          WORK_DIR: ${{ github.workspace }}/.corpus-work
          SCAN_TIMEOUT: "1200"
        run: bash tests/test-real-corpus.sh

      - name: Keep the results table
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: real-corpus-results
          path: .corpus-work/results.tsv
          if-no-files-found: ignore
