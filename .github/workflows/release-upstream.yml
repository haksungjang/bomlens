# Assembles a sktelecom/bomlens release on this repository's runners.
#
# Each job calls the definition that lives in sktelecom/bomlens rather than a
# copy, so the two never drift and the artefacts keep that repository's signing
# identity: Sigstore builds the certificate subject from the called workflow's
# ref. The certificate separately records that the run happened here, which is
# accurate and not hidden.
#
# Before running this, the release commit must already be on sktelecom's main:
# the release is created at that branch's head, and the tag is created with it.
#
# Needs UPSTREAM_PUBLISH_TOKEN, a token with contents:write and packages:write
# on sktelecom/bomlens.
name: Release upstream

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, with the leading v (e.g. v1.11.7)'
        required: true
        type: string
      push_images:
        description: 'Publish the container images (off = build and scan only)'
        required: true
        type: boolean
        default: true
      run_images:
        description: 'Build the images at all. Turn off to re-run only the release when they are already published.'
        required: false
        type: boolean
        default: true
      run_installers:
        description: 'Build the installers. Turn off when they are already attached to the release.'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

# Safe to key by version here, unlike docker-publish.yml/release.yml: this
# workflow is only ever reached by a deliberate workflow_dispatch (no push
# trigger, and nothing else calls it), so the only way to get two runs in the
# same group is a human dispatching the same version twice. No
# cancel-in-progress -- the second dispatch queues behind the first rather
# than killing a signing/publish step partway through; a different version
# gets its own group and runs unaffected.
concurrency:
  group: release-upstream-${{ inputs.version }}

jobs:
  # The images first: release.yml's gate pulls the published image to verify the
  # documented first-scan command, and the desktop app pins the image matching
  # its own version, so a release without them is not usable.
  images:
    name: Images
    if: inputs.run_images
    uses: sktelecom/bomlens/.github/workflows/docker-publish.yml@main
    permissions:
      contents: write
      id-token: write
      packages: write
      # docker-publish.yml's jobs now upload-sarif, which needs this. A
      # called workflow cannot ask for more than the caller grants -- omitting
      # this makes every job in that workflow fail before it starts (see
      # commit 6dc87c8b, the same failure mode from a missing packages:read).
      # Note this does not make the SARIF uploads themselves succeed here:
      # the `github` context inside a reusable workflow call resolves to the
      # CALLER's repository, so a run through this path uploads to the
      # fork's Security tab, not sktelecom/bomlens's -- and code scanning is
      # off by default on a fork, so the upload 403s (silently, under
      # continue-on-error: true). The scans still run and gate nothing
      # (report-only by design), so this is a visibility gap, not a
      # correctness one: the Security-tab numbers this was meant to surface
      # are only real from a direct push/tag run against the org repo.
      security-events: write
    with:
      owner: sktelecom
      push: ${{ inputs.push_images }}
      # Without this the images carry only latest and sha-: the semver tags come
      # from the git ref, and this workflow is dispatched from a branch.
      version: ${{ inputs.version }}
    secrets:
      PUBLISH_TOKEN: ${{ secrets.UPSTREAM_PUBLISH_TOKEN }}

  # Creates the release and the tag, uploads the CLI bundles, the examples, the
  # source SBOM and the signed checksums, then holds it a draft until its gate
  # has verified the published image and the attached installers.
  release:
    name: Release
    uses: sktelecom/bomlens/.github/workflows/release.yml@main
    permissions:
      contents: write
      id-token: write
      # The gate inside pulls the image it just published to run the documented
      # first-scan command against it. A called workflow cannot ask for more
      # than the caller grants, so the read has to be granted here.
      packages: read
    with:
      version: ${{ inputs.version }}
      target_repository: sktelecom/bomlens
      owner: sktelecom
    secrets:
      PUBLISH_TOKEN: ${{ secrets.UPSTREAM_PUBLISH_TOKEN }}

  # Attaches the installers. Deliberately not ordered after the release job:
  # that job's gate waits for these installers, so making this wait for it in
  # turn would deadlock. They run alongside each other exactly as they do when a
  # tag push starts both, and the attach creates the release as a draft if it
  # gets there first.
  desktop:
    name: Installers
    if: inputs.run_installers
    uses: sktelecom/bomlens/.github/workflows/desktop.yml@main
    permissions:
      contents: write
    with:
      target_repository: sktelecom/bomlens
      tag: ${{ inputs.version }}
    secrets:
      PUBLISH_TOKEN: ${{ secrets.UPSTREAM_PUBLISH_TOKEN }}
